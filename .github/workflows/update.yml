name: Record and score forecasts

on:
  schedule:
    # 09:00 UTC = 21:00 NZST / 22:00 NZDT, after the day's 00Z model runs are in.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record forecasts and score against ERA5
        run: python scripts/update.py
      - name: Commit data
        run: |
          git config user.name "ski-weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: record forecasts $(date -u +%F)"
            git push
          fi
